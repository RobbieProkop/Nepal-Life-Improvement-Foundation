<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      /* Same pre-paint theme init as the homepage. Paths are root-absolute
         because this file is also served for deep missing URLs like /a/b/c. */
      (function () {
        var root = document.documentElement;
        var theme = "light";

        try {
          var stored = localStorage.getItem("nlif-theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          } else if (
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            theme = "dark";
          }
        } catch (e) {
          /* Storage blocked; light default stands. */
        }

        root.dataset.theme = theme;
        root.classList.add("js");
      })();
    </script>

    <title>Page not found — Nepal Life Improvement Foundation</title>
    <meta
      name="description"
      content="That page is not on this trail. Return to the Nepal Life Improvement Foundation homepage."
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a6b7c" />
    <meta name="color-scheme" content="light dark" />
    <!-- Root-absolute URLs so CSS/JS still load when the server serves this
         file for a nested missing path. -->
    <link rel="shortcut icon" type="image/x-icon" href="/icons/favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/unified.css" />
    <link rel="stylesheet" href="/css/error.css" />
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="texture" aria-hidden="true"></div>

    <header class="masthead" data-masthead>
      <div class="masthead__bar shell">
        <a class="masthead__logo" href="/">
          <span class="masthead__mark" aria-hidden="true"></span>
          Nepal Life
          <span class="masthead__sub">Improvement Foundation</span>
        </a>

        <button
          class="masthead__toggle"
          type="button"
          data-theme-toggle
          aria-label="Switch to dark theme"
          title="Switch to dark theme"
        >
          <svg
            class="icon-moon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"
            />
          </svg>
          <svg
            class="icon-sun"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"
            />
          </svg>
        </button>
      </div>
    </header>

    <main id="main" class="lost">
      <div class="lost__inner shell">
        <p class="lost__status">Error · Trail ends here</p>
        <p class="lost__code" aria-hidden="true">404</p>
        <h1 class="lost__title">This path is not on the map.</h1>
        <p class="lost__body">
          The page you asked for is not here — it may have moved, or the link
          may be out of date. The work in Pachabhaiya is still on the homepage.
        </p>
        <div class="lost__actions">
          <a class="btn" href="/">Back to the homepage</a>
          <a class="arrow-link" href="/#give">Donate instead</a>
        </div>
      </div>
    </main>

    <script src="/js/theme.js" defer></script>
  </body>
</html>
